name: Windows desktop release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Verify stable release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match the stable package version' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Package Windows x64
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - name: Verify installer and update feed
        run: ./scripts/verify-windows-release.ps1
      - name: Start the packaged application
        run: node scripts/smoke-windows-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
            dist/latest.yml

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --title "追更小报 $GITHUB_REF_NAME" --notes "Windows x64 请下载 setup.exe。已安装的追更小报会自动检查并下载此版本。"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
