name: Windows desktop release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Verify stable release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match the stable package version' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Package Windows x64
        run: node scripts/build-tool.cjs --win nsis --x64 --publish never
      - name: Create portable folder ZIP
        run: ./scripts/package-portable.ps1
      - name: Verify installer and update feed
        run: ./scripts/verify-windows-release.ps1
      - name: Start the packaged application
        run: node scripts/smoke-windows-release.mjs
      - name: Verify extracted portable edition
        run: |
          $metadata = Get-Content dist/latest-portable.json -Raw | ConvertFrom-Json
          $zip = Get-Item "dist/$($metadata.file)"
          if ($zip.Length -ne $metadata.bytes -or (Get-FileHash $zip.FullName -Algorithm SHA512).Hash.ToLowerInvariant() -cne $metadata.sha512) { throw 'Invalid portable feed' }
          [IO.Compression.ZipFile]::ExtractToDirectory($zip.FullName, (Join-Path $PWD 'dist/acceptance'))
          node scripts/smoke-windows-release.mjs dist/acceptance/episode-herald portable
      - name: Verify installed data survives upgrade and uninstall
        run: ./scripts/verify-installed-data.ps1
      - name: Verify portable replacement and recovery
        run: ./scripts/verify-portable-upgrade.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
            dist/latest.yml
            dist/*-portable.zip
            dist/latest-portable.json

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --title "追更小报 $GITHUB_REF_NAME" --notes "Windows x64 提供免安装 ZIP 和安装版 EXE。请选择 C 盘以外的可写目录。两种版本均将追更记录、封面、日志及更新缓存保存在程序旁的 data 文件夹，并使用各自的自动更新通道。"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
