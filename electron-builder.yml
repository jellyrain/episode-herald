appId: com.episodeherald.desktop
electronDist: node_modules/electron/dist
afterPack: scripts/after-pack.cjs
publish:
  provider: generic
  url: https://github.com/jellyrain/episode-herald/releases/latest/download/
directories:
  buildResources: build
extraResources:
  - from: scripts/decode-cover.mjs
    to: cover-decoder/decode-cover.mjs
  - from: node_modules/libheif-js/libheif-wasm/libheif-bundle.js
    to: cover-decoder/libheif.cjs
  - from: node_modules/libheif-js/LICENSE
    to: cover-decoder/LICENSE-libheif-js
  - from: node_modules/libheif-js/libheif-wasm/LICENSE
    to: cover-decoder/LICENSE-libheif
files:
  - out/**/*
  - resources/**/*
  - LICENSE
  - NOTICE
asarUnpack:
  - resources/**
  - out/main/**/*.ico
win:
  target: nsis
  icon: build/icon.ico
  executableName: episode-herald
nsis:
  # Keep the installer identity used before the project was renamed.
  guid: c149cfd5-c4c3-511c-8209-395d98cef9a8
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
